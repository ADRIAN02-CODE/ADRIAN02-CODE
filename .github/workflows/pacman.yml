name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ADRIAN02-CODE

      - name: Push SVGs to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output || true
          git worktree add -B output ../output-wt "$(git rev-parse --verify -q origin/output || echo HEAD)"
          cp dist/*.svg ../output-wt/
          cd ../output-wt
          git add -A
          git diff --cached --quiet || git commit -m "Update Pac-Man contribution graph"
          git push origin output
